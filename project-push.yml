# Push notifications (Part C, under review): project.yml plus the push wiring, built only by the
# push thread until the owner signs off. Generates HermesPush.xcodeproj; never used for releases.
# On merge: fold these additions into project.yml, move Push/App into App/Push, and drop HERMES_PUSH.
name: HermesPush
options:
  bundleIdPrefix: co.caffeinatedcode
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  configs:
    Debug:
      HERMES_APP_BUNDLE_ID: co.caffeinatedcode.hermes.dev
      HERMES_APP_GROUP: group.co.caffeinatedcode.hermes.dev
      HERMES_KEYCHAIN_GROUP: co.caffeinatedcode.hermes.dev.push
    Release:
      HERMES_APP_BUNDLE_ID: co.caffeinatedcode.hermes
      HERMES_APP_GROUP: group.co.caffeinatedcode.hermes
      HERMES_KEYCHAIN_GROUP: co.caffeinatedcode.hermes.push
  base:
    # The shared Keychain group's team prefix (the App ID prefix is the team id).
    HERMES_KEYCHAIN_PREFIX: 29ZNGBT83H.
    # The Mac app doesn't use the App Group (local notifications only; see docs).
    "HERMES_APP_GROUP[sdk=macosx*]": ""
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 29ZNGBT83H
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  HermesKit:
    path: Packages/HermesKit
  # Mac-only support (Sparkle), linked only into macOS builds.
  HermesMacSupport:
    path: Packages/HermesMacSupport

targets:
  Hermes:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        # This spec's Info.plist is Push/App/Info.plist; the shipping one must not become a resource.
        excludes: ["Resources/Info.plist"]
      - path: Push/App
        excludes: ["*.plist", "*.entitlements"]
      - path: Push/Shared
    dependencies:
      - package: HermesKit
        product: HermesKit
      - package: HermesKit
        product: HermesPush
      - package: HermesKit
        product: HermesMarkdown
      - target: HermesNotificationService
        destinationFilters: [iOS]
      - target: HermesNotificationContent
        destinationFilters: [iOS]
      - target: HermesWidgets
        destinationFilters: [iOS]
      - package: HermesMacSupport
        product: HermesMacSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.caffeinatedcode.hermes
        PRODUCT_NAME: Hermes
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Push/App/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Push/App/Hermes-iOS.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HERMES_PUSH"
        INFOPLIST_KEY_CFBundleDisplayName: Hermes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Caffeinated Code d.o.o."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Hermes connects to Hermes Agent gateways running on your local network."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos to share with Hermes and scan pairing codes to connect."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dictate messages and talk with Hermes in Voice mode. What you say is turned into text on this device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turn what you say into text on this device, for dictation and Voice mode."
        # hermesapp://connect links (pairing QR codes). Debug uses its own scheme so it never
        # takes links meant for the real app.
        HERMES_URL_SCHEME: hermesapp
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsMultipleScenes[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphone*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphone*]": UIStatusBarStyleDefault
        ENABLE_PREVIEWS: YES
        # The Mac app ships as a notarized Developer ID DMG with Sparkle (not the Mac App Store):
        # Hardened Runtime is required for notarization; no App Sandbox, so Sparkle installs updates
        # in place without XPC installer exceptions. iOS and iPadOS go to TestFlight / the App Store.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        # Dictation and Voice mode on the Mac (Hardened Runtime gates the microphone).
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        # Sparkle (macOS only; iOS ignores these keys). SUPublicEDKey pairs with the appcast-signing
        # private key kept in Infisical — never rotate it: shipped apps only trust this public key.
        # Values land in App/Resources/Info.plist (SUFeedURL, SUPublicEDKey).
        HERMES_APPCAST_URL: ""
        HERMES_SPARKLE_PUBLIC_KEY: ""
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphone*]": "$(inherited) @executable_path/Frameworks"
      configs:
        # Debug builds are a separate app ("Hermes Dev"): own bundle id, Keychain items,
        # settings and icon, and the only builds that can bootstrap the demo gateway.
        # Release (TestFlight / App Store) is the real "Hermes" and never touches demo data.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: co.caffeinatedcode.hermes.dev
          INFOPLIST_KEY_CFBundleDisplayName: Hermes Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          HERMES_URL_SCHEME: hermesapp-dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: co.caffeinatedcode.hermes
          INFOPLIST_KEY_CFBundleDisplayName: Hermes
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          # Mac updates: the appcast rides along with each GitHub release; the EdDSA public key
          # pairs with Infisical prod /hermes/ci/SPARKLE_ED_PRIVATE_KEY (never rotate).
          HERMES_APPCAST_URL: https://github.com/vburojevic/hermes-releases/releases/latest/download/appcast.xml
          HERMES_SPARKLE_PUBLIC_KEY: IUPLRKpg3gIVLpvG7a59SUTYCB6j707Jwmk9oYNlP4c=

  HermesNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Push/NotificationService
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - package: HermesKit
        product: HermesPush
      - sdk: Intents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_APP_BUNDLE_ID).NotificationService
        PRODUCT_NAME: HermesNotificationService
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Push/NotificationService/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Hermes Notifications
        CODE_SIGN_ENTITLEMENTS: Push/NotificationService/NotificationService.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  HermesNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: Push/NotificationContent
        excludes: ["*.plist", "*.entitlements"]
      - path: Push/Extensions
      - path: App/Design/Palette.swift
      - path: App/Design/HermesMarkPath.swift
    dependencies:
      - package: HermesKit
        product: HermesPush
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_APP_BUNDLE_ID).NotificationContent
        PRODUCT_NAME: HermesNotificationContent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Push/NotificationContent/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Hermes Requests
        CODE_SIGN_ENTITLEMENTS: Push/NotificationContent/NotificationContent.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  HermesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Push/Widgets
        excludes: ["*.plist", "*.entitlements"]
      - path: Push/Shared
      - path: Push/Extensions
      - path: App/Design/Palette.swift
      - path: App/Design/HermesMarkPath.swift
    dependencies:
      - package: HermesKit
        product: HermesPush
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_APP_BUNDLE_ID).Widgets
        PRODUCT_NAME: HermesWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Push/Widgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Hermes
        CODE_SIGN_ENTITLEMENTS: Push/Widgets/Widgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HERMES_WIDGET"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

schemes:
  Hermes:
    build:
      targets:
        Hermes: all
    run:
      config: Debug
    archive:
      config: Release
